<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=no">
<title>Barcelona – interaktív ingatlantérkép</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#map{background:#dcecf5}
.leaflet-popup-content{margin:13px 15px;min-width:220px}
.name{font-size:17px;font-weight:700;margin-bottom:8px}
.item{border-top:1px solid #eee;padding-top:8px;margin-top:8px}
.item b{display:block}
.item a{color:#1565c0;text-decoration:none}
.barrio-label{
 background:rgba(255,255,255,.82);
 border:0;
 box-shadow:0 1px 4px rgba(0,0,0,.20);
 color:#222;
 font-size:12px;
 font-weight:600;
 padding:3px 5px;
 border-radius:4px;
 white-space:nowrap
}
.barrio-label:before{display:none}
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:true}).setView([41.3874,2.1686],12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 maxZoom:19,
 attribution:'© OpenStreetMap contributors'
}).addTo(map);

const listings=[
 {id:'109440457',lat:41.4102622,lon:2.2090496,title:'Calle del Treball, 67 V',size:'430 m²',rent:'4 200 €/hó',deposit:'1 havi kaució',sqm:'9,77 €/m²',url:'https://www.idealista.com/inmueble/109440457/'},
 {id:'111059305',lat:41.3553244,lon:2.1039505,title:'Zona del Mig',size:'350 m²',rent:'2 900 €/hó',deposit:'2 havi kaució',sqm:'8,29 €/m²',url:'https://www.idealista.com/inmueble/111059305/'},
 {id:'108885012',lat:41.4184276,lon:2.1828846,title:'Calle de las Navas de Tolosa, 334',size:'453 m²',rent:'1 700 €/hó az 1. évben; 2 100 € a 2. évben; 2 500 € a 3. évtől',deposit:'2 havi kaució',sqm:'5,52 €/m²',url:'https://www.idealista.com/inmueble/108885012/'},
 {id:'112096883',lat:41.3528613,lon:2.1248373,title:'Calle de les Ciències',size:'500 m²',rent:'4 200 €/hó',deposit:'Nincs megadva',sqm:'8,40 €/m²',url:'https://www.idealista.com/inmueble/112096883/'},
 {id:'111622804',lat:41.4397568,lon:2.1773824,title:'Calle Font d’en Canyelles',size:'452 m²',rent:'2 000 €/hó',deposit:'Nincs megadva',sqm:'4,42 €/m²',url:'https://www.idealista.com/inmueble/111622804/'}
];

const palette=[
 '#cfe8f3','#f3dfc1','#d9ead3','#f6dfad','#e5d8ef',
 '#f2d2d2','#d3e8e2','#e9dfc5','#d8e0f1','#dcebd5'
];

function pointInPolygon(lat,lon,ring){
 let inside=false;
 for(let i=0,j=ring.length-1;i<ring.length;j=i++){
  const yi=ring[i][0],xi=ring[i][1];
  const yj=ring[j][0],xj=ring[j][1];
  const intersect=((yi>lat)!==(yj>lat)) &&
    (lon<(xj-xi)*(lat-yi)/(yj-yi)+xi);
  if(intersect) inside=!inside;
 }
 return inside;
}

function popupForListing(x){
 return '<div class="name">'+(x.barri||'Barcelona környéke')+'</div>'+
 '<b>'+x.title+'</b><br>'+x.size+' · '+x.rent+'<br>'+
 x.deposit+' · '+x.sqm+'<br>'+
 '<a href="'+x.url+'" target="_blank" rel="noopener">Idealista →</a>';
}

fetch('./barris.json')
 .then(r=>r.json())
 .then(rows=>{
   const features=rows.map((x,i)=>({
     type:'Feature',
     properties:{nom:x.nom,color:palette[i%palette.length]},
     geometry:{
       type:'Polygon',
       coordinates:[x.geometry.map(p=>[p[1],p[0]])]
     }
   }));

   // Approximate listing points are assigned automatically to the barrio polygon.
   listings.forEach(x=>{
     const f=features.find(f=>pointInPolygon(x.lat,x.lon,f.geometry.coordinates[0].map(p=>[p[1],p[0]])));
     if(f) x.barri=f.properties.nom;
   });

   const canvasRenderer=L.canvas({padding:0.5});

   const layer=L.geoJSON(
     {type:'FeatureCollection',features},
     {
       renderer:canvasRenderer,
       style:f=>({
         color:'#d63b35',
         weight:1.6,
         opacity:.95,
         fillColor:f.properties.color,
         fillOpacity:.30,
         fill:true
       }),
       onEachFeature:(f,l)=>{
         const name=f.properties.nom;
         const found=listings.filter(x=>x.barri===name);

         let html='<div class="name">'+name+'</div>';
         if(found.length){
           found.forEach(x=>{
             html+='<div class="item"><b>'+x.title+'</b>'+
               x.size+' · '+x.rent+'<br>'+
               x.deposit+' · '+x.sqm+'<br>'+
               '<a href="'+x.url+'" target="_blank" rel="noopener">Idealista →</a></div>';
           });
         }else{
           html+='<div>Nincs még hozzárendelt ingatlan.</div>';
         }

         l.bindTooltip(name,{
           permanent:true,
           direction:'center',
           className:'barrio-label',
           opacity:.95
         });
         l.bindPopup(html);

         l.on('mouseover',()=>{
           l.setStyle({weight:3,fillOpacity:.42});
           l.bringToFront();
         });
         l.on('mouseout',()=>{
           l.setStyle({weight:1.6,fillOpacity:.30});
         });
       }
     }
   ).addTo(map);

   // Show the complete Barcelona area plus the nearby Hospitalet listings.
   const bounds=layer.getBounds();
   listings.forEach(x=>bounds.extend([x.lat,x.lon]));
   map.fitBounds(bounds,{padding:[12,12]});

   // Add property markers after barrio assignment.
   listings.forEach(x=>{
     const marker=L.circleMarker([x.lat,x.lon],{
       radius:7,
       color:'#111827',
       weight:2,
       fillColor:'#fff',
       fillOpacity:1
     });
     marker.bindPopup(popupForListing(x));
     marker.addTo(map);
   });
 })
 .catch(e=>console.error('barris.json betöltési hiba:',e));
</script>
</body>
</html>
