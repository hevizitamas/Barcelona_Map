<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=no">
<title>Barcelona – interaktív ingatlantérkép</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#map{background:#dcecf5}
.leaflet-popup-content{margin:13px 15px;min-width:220px}
.name{font-size:17px;font-weight:700;margin-bottom:8px}
.item{border-top:1px solid #eee;padding-top:8px;margin-top:8px}
.item b{display:block}
.item a{color:#1565c0;text-decoration:none}
.barrio-label{
 background:rgba(255,255,255,.82);
 border:0;
 box-shadow:0 1px 4px rgba(0,0,0,.20);
 color:#222;
 font-size:12px;
 font-weight:600;
 padding:3px 5px;
 border-radius:4px;
 white-space:nowrap
}
.barrio-label:before{display:none}
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:true}).setView([41.3874,2.1686],12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 maxZoom:19,
 attribution:'© OpenStreetMap contributors'
}).addTo(map);

const listings=[
 {id:'109440457',lat:41.4102622,lon:2.2090496,title:'Calle del Treball, 67 V',size:'430 m²',rent:'4 200 €/hó',deposit:'1 havi kaució',sqm:'9,77 €/m²',url:'https://www.idealista.com/inmueble/109440457/'},
 {id:'111059305',lat:41.3553244,lon:2.1039505,title:'Zona del Mig',size:'350 m²',rent:'2 900 €/hó',deposit:'2 havi kaució',sqm:'8,29 €/m²',url:'https://www.idealista.com/inmueble/111059305/'},
 {id:'108885012',lat:41.4184276,lon:2.1828846,title:'Calle de las Navas de Tolosa, 334',size:'453 m²',rent:'1 700 €/hó az 1. évben; 2 100 € a 2. évben; 2 500 € a 3. évtől',deposit:'2 havi kaució',sqm:'5,52 €/m²',url:'https://www.idealista.com/inmueble/108885012/'},
 {id:'112096883',lat:41.3528613,lon:2.1248373,title:'Calle de les Ciències',size:'500 m²',rent:'4 200 €/hó',deposit:'Nincs megadva',sqm:'8,40 €/m²',url:'https://www.idealista.com/inmueble/112096883/'},
 {id:'111622804',lat:41.4397568,lon:2.1773824,title:'Calle Font d’en Canyelles',size:'452 m²',rent:'2 000 €/hó',deposit:'Nincs megadva',sqm:'4,42 €/m²',url:'https://www.idealista.com/inmueble/111622804/'}
];

const palette=[
 '#b9dff0','#ead7b7','#c9e3c0','#f2d39b','#d9c8e8',
 '#f0c7c7','#c5ddd9','#e2d7b8','#cbd6ec','#d8e8d0',
 '#c8e2df','#ead1df','#d8e3c1','#f1d5c6','#d4d8ed'
];

function listingPopup(x){
 return '<div class="name">'+(x.barri||'Barcelona környéke')+'</div>'+
 '<b>'+x.title+'</b><br>'+x.size+' · '+x.rent+'<br>'+
 x.deposit+' · '+x.sqm+'<br>'+
 '<a href="'+x.url+'" target="_blank" rel="noopener">Idealista →</a>';
}

fetch('./barris.json')
 .then(r=>{
   if(!r.ok) throw new Error('barris.json HTTP '+r.status);
   return r.json();
 })
 .then(rows=>{
   console.log('Barcelona barris betöltve:',rows.length);

   // IMPORTANT: barris.json already stores coordinates as [latitude, longitude].
   // Draw them directly with Leaflet polygons; do NOT convert them to GeoJSON.
   const barrioLayers=[];
   const allBounds=L.latLngBounds([]);

   rows.forEach((barrio,i)=>{
     const latLngs=barrio.geometry.map(p=>[p[0],p[1]]);
     const color=palette[i%palette.length];

     const poly=L.polygon(latLngs,{
       renderer:L.canvas(),
       color:'#d63b35',
       weight:1.7,
       opacity:0.95,
       fillColor:color,
       fillOpacity:0.28,
       interactive:true
     }).addTo(map);

     poly.bindTooltip(barrio.nom,{
       permanent:true,
       direction:'center',
       className:'barrio-label',
       opacity:0.95
     });

     poly.on('mouseover',()=>{
       poly.setStyle({weight:3,fillOpacity:0.42});
       poly.bringToFront();
     });
     poly.on('mouseout',()=>{
       poly.setStyle({weight:1.7,fillOpacity:0.28});
     });

     poly.on('click',()=>{
       const found=listings.filter(x=>pointInPolygon([x.lat,x.lon],latLngs));
       let h='<div class="name">'+barrio.nom+'</div>';
       if(found.length){
         found.forEach(x=>{
           h+='<div class="item"><b>'+x.title+'</b>'+x.size+' · '+x.rent+
              '<br>'+x.deposit+' · '+x.sqm+
              '<br><a href="'+x.url+'" target="_blank" rel="noopener">Idealista →</a></div>';
         });
       }else{
         h+='<div>Nincs még hozzárendelt ingatlan.</div>';
       }
       poly.bindPopup(h).openPopup();
     });

     latLngs.forEach(p=>allBounds.extend(p));
     barrioLayers.push(poly);
   });

   // Keep the entire 73-barrio Barcelona area in view.
   listings.forEach(x=>allBounds.extend([x.lat,x.lon]));
   map.fitBounds(allBounds,{padding:[12,12]});

   // Add property markers after all polygons are present.
   listings.forEach(x=>{
     const marker=L.circleMarker([x.lat,x.lon],{
       radius:7,color:'#111827',weight:2,fillColor:'#fff',fillOpacity:1
     }).addTo(map);
     marker.bindPopup(listingPopup(x));
   });
 })
 .catch(e=>{
   console.error(e);
   alert('A városrészek térképadatának betöltése nem sikerült.');
 });

function pointInPolygon(point,vs){
 const y=point[0],x=point[1];
 let inside=false;
 for(let i=0,j=vs.length-1;i<vs.length;j=i++){
   const yi=vs[i][0],xi=vs[i][1];
   const yj=vs[j][0],xj=vs[j][1];
   const intersect=((yi>y)!==(yj>y)) &&
     (x<(xj-xi)*(y-yi)/(yj-yi)+xi);
   if(intersect) inside=!inside;
 }
 return inside;
}
</script>
</body>
</html>
